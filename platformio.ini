; PlatformIO Project Configuration File
;
; To test/flash a specific example, change src_dir below:
;   src_dir = examples/BasicKeyboard
;   src_dir = examples/KeyboardInputTest
;   src_dir = examples/DeviceSelector

[platformio]
default_envs = esp32dev
src_dir = examples/BasicKeyboard

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.3.2
    symlink://.